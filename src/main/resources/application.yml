spring:
  application:
    name: messatto
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/messatto}
    username: ${SPRING_DATASOURCE_USERNAME:messatto}
    password: ${SPRING_DATASOURCE_PASSWORD:messatto}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:messatto-local-dev-secret-change-me-please-32-bytes-minimum}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  qr:
    ttl-seconds: ${QR_TOKEN_TTL_SECONDS:900}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.messatto: INFO
